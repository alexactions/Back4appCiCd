name: CI/CD Back4app Deploy Pipeline

on:
  push:
    branches:
      - staging
      - test
      - main
  pull_request:
    branches:
      - staging
      - test
      - main

env:
  B4A_ACCOUNT_KEY: ${{ secrets.B4A_ACCOUNT_KEY }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier
        run: npm prettier --check .
      - name: Run NPM Build
        run: npm run build
      - name: Run Tests
        run: npm test

    deploy_staging:
      if: github.ref == 'refs/heads/staging'
      runs-on: ubuntu-latest
      needs: checks
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Install B4A CLI
          run: |
            curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash
            b4a --version
        - name: Configure B4A CLI
          run: echo "${{ env.B4A_ACCOUNT_KEY }}" | b4a configure accuntkey --stdin
        - name Deploy to Staging App
          run: b4a deploy --app "ZuZTwiLmjLLkDm4sh2gTjNpbQIT0YHoI0lhNnmi7"

    deploy_test:
      if: github.ref == 'refs/heads/test'
      runs-on: ubuntu-latest
      needs: [checks, deploy_staging]
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Install B4A CLI
          run: |
            curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash
            b4a --version
        - name: Configure B4A CLI
          run: echo "${{ env.B4A_ACCOUNT_KEY }}" | b4a configure accuntkey --stdin
        - name Deploy to Test App
          run: b4a deploy --app "9gMCwQsaVruMX64kAVCKXVIDj2YvMEhHZ97js7P3"

    deploy_main:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      needs: [checks, deploy_staging, deploy_test]
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Install B4A CLI
          run: |
            curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash
            b4a --version
        - name: Configure B4A CLI
          run: echo "${{ env.B4A_ACCOUNT_KEY }}" | b4a configure accuntkey --stdin
        - name Deploy to Main App
          run: b4a deploy --app "OSTQSiMml4v3sqc728fuNvjx9zs3DgnZZzutAj6W"